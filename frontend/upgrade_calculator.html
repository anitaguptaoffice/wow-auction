<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装备升级计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
        }

        .info-box p {
            margin: 5px 0;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-container {
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .result-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item span:first-child {
            color: #666;
        }

        .result-item span:last-child {
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }

        .error {
            color: #e74c3c;
            background: #ffebee;
            border-left-color: #e74c3c;
        }

        .success {
            color: #27ae60;
        }

        .warning {
            color: #f39c12;
            background: #fff8e1;
            border-left-color: #f39c12;
        }

        /* 可展开面板样式 */
        .collapsible {
            background: #f0f4ff;
            border: none;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            padding: 12px 15px;
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .collapsible:hover {
            background: #e6edff;
        }

        .collapsible::after {
            content: '▼';
            font-size: 12px;
            transition: transform 0.3s;
        }

        .collapsible.active::after {
            transform: rotate(-180deg);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            border-radius: 0 0 5px 5px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .collapsible-content.active {
            max-height: 500px;
            padding: 0 15px 15px 15px;
        }

        .collapsible-content p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }

        .main-result {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>⚔️ 装备升级计算器</h1>

        <button class="collapsible">📋 升级规则说明</button>
        <div class="collapsible-content">
            <p><strong>升级规则：</strong></p>
            <p>• 升级循环：4-3-3-3（重复）</p>
            <p>• 绿沙：提升1个档位</p>
            <p>• 蓝沙：提升3个档位</p>
            <p>• 最后一次必须使用蓝沙（737→747）</p>
            <p>• 蓝沙最多使用16个，至少需要2个绿沙</p>
        </div>

        <div class="input-group">
            <label for="currentLevel">当前装备等级：</label>
            <input type="number" id="currentLevel" min="584" max="737" placeholder="输入584-737之间的等级">
        </div>

        <div class="input-group">
            <label for="blueSand">现有蓝沙数量：</label>
            <input type="number" id="blueSand" min="0" step="1" placeholder="输入蓝沙数量">
        </div>

        <div class="input-group">
            <label for="greenSand">现有绿沙数量：</label>
            <input type="number" id="greenSand" min="0" step="1" placeholder="输入绿沙数量">
        </div>

        <div class="button-container">
            <button onclick="calculate()">计算所需材料</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        // 生成从584到747的等级序列
        function generateLevelSequence() {
            const levels = [584];
            const pattern = [4, 3, 3, 3];
            let patternIndex = 0;
            let currentLevel = 584;

            while (currentLevel < 747) {
                currentLevel += pattern[patternIndex];
                levels.push(currentLevel);
                patternIndex = (patternIndex + 1) % 4;
            }

            return levels;
        }

        const levelSequence = generateLevelSequence();

        // 检查等级是否有效
        function isValidLevel(level) {
            return levelSequence.includes(level);
        }

        // 获取从当前等级到747需要的档位数
        function getStepsToMax(currentLevel) {
            const currentIndex = levelSequence.indexOf(currentLevel);
            const maxIndex = levelSequence.indexOf(747);
            return maxIndex - currentIndex;
        }

        function calculate() {
            const currentLevel = parseInt(document.getElementById('currentLevel').value);
            const blueSand = parseInt(document.getElementById('blueSand').value);
            const greenSand = parseInt(document.getElementById('greenSand').value);
            const resultDiv = document.getElementById('result');

            // 验证输入
            if (isNaN(currentLevel) || isNaN(blueSand) || isNaN(greenSand)) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ 请填写所有字段！
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            if (currentLevel < 584 || currentLevel > 737) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ 装备等级必须在584-737之间！
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            if (!isValidLevel(currentLevel)) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ ${currentLevel} 不是有效的装备等级！<br>
                        有效等级必须符合4-3-3-3的升级循环。
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            if (blueSand < 1) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ 至少需要1个蓝沙（最后一次升级737→747必须使用蓝沙）！
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            // 计算总档位数
            const totalSteps = getStepsToMax(currentLevel);

            // 最后3个档位必须用蓝沙（737→747）
            const lastBlue = 1;
            const remainingSteps = totalSteps - 3;

            // 蓝沙最多使用16个（包含最后必须的1个），所以可用于584-737的蓝沙最多15个
            const maxUsableBlue = 15;

            // 计算实际可用蓝沙（除去最后必须用的1个，且不超过15个）
            const availableBlue = Math.min(blueSand - lastBlue, maxUsableBlue);

            // 计算蓝沙可以覆盖的档位（优先使用蓝沙）
            const blueSteps = Math.min(availableBlue * 3, remainingSteps);

            // 剩余需要绿沙的档位
            const greenStepsNeeded = remainingSteps - blueSteps;

            // 至少需要2个绿沙
            const minGreenRequired = 2;
            if (greenStepsNeeded < minGreenRequired && remainingSteps > 0) {
                // 如果计算出的绿沙需求少于2个，需要调整
                // 减少蓝沙使用，确保至少用2个绿沙
                const adjustedBlueSteps = remainingSteps - minGreenRequired;
                const adjustedBlueUsed = Math.ceil(adjustedBlueSteps / 3);
                const adjustedGreenSteps = remainingSteps - (adjustedBlueUsed * 3);

                const actualBlueUsed = adjustedBlueUsed;
                const actualGreenUsed = adjustedGreenSteps;

                // 计算还需要多少绿沙
                const greenNeeded = Math.max(0, actualGreenUsed - greenSand);

                // 检查是否满足至少2个绿沙的要求
                if (greenSand < minGreenRequired) {
                    resultDiv.innerHTML = `
                        <div class="info-box error">
                            ❌ 至少需要${minGreenRequired}个绿沙！<br>
                            当前有${greenSand}个绿沙，还需要${minGreenRequired - greenSand}个绿沙。
                        </div>
                    `;
                    resultDiv.classList.add('show');
                    return;
                }

                // 生成结果
                let resultHTML = '';

                if (greenNeeded > 0) {
                    resultHTML += `
                        <div class="info-box warning main-result">
                            ⚠️ 还需要 <strong>${greenNeeded}</strong> 个绿沙才能升到747！
                        </div>
                    `;
                } else {
                    resultHTML += `
                        <div class="info-box success main-result">
                            ✅ 材料充足！可以升到747！
                        </div>
                    `;
                }

                // 显示升级路径建议
                resultHTML += `<div class="info-box">
                    <strong>💡 升级建议：</strong><br>
                    • 从 ${currentLevel} 到 737：先使用 ${actualBlueUsed} 个蓝沙，再使用 ${actualGreenUsed} 个绿沙<br>
                    • 从 737 到 747：使用 1 个蓝沙（必须）
                </div>`;

                // 详细分析面板
                resultHTML += `
                    <button class="collapsible">📊 详细分析</button>
                    <div class="collapsible-content">
                        <p style="margin-top: 10px;"><strong>数据详情：</strong></p>
                        <p>• 总共需要档位：${totalSteps} 个</p>
                        <p>• 使用蓝沙（含最后1个）：${actualBlueUsed + 1} 个</p>
                        <p>• 使用绿沙：${Math.min(greenSand, actualGreenUsed)} 个</p>
                        <p style="margin-top: 10px;"><strong>注意事项：</strong></p>
                        <p>• 蓝沙最多使用16个</p>
                        <p>• 至少需要2个绿沙</p>
                        <p>• 最后一次升级（737→747）必须使用蓝沙</p>
                    </div>
                `;

                resultDiv.innerHTML = resultHTML;
                resultDiv.classList.add('show');

                return;
            }

            // 计算实际使用的蓝沙数量
            const actualBlueUsed = Math.ceil(blueSteps / 3);

            // 计算还需要多少绿沙
            const greenNeeded = Math.max(0, greenStepsNeeded - greenSand);

            // 检查是否满足至少2个绿沙的要求
            if (greenStepsNeeded < minGreenRequired) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ 配置错误：根据规则，至少需要${minGreenRequired}个绿沙！
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            if (greenSand < minGreenRequired) {
                resultDiv.innerHTML = `
                    <div class="info-box error">
                        ❌ 至少需要${minGreenRequired}个绿沙！<br>
                        当前有${greenSand}个绿沙，还需要${minGreenRequired - greenSand}个绿沙。
                    </div>
                `;
                resultDiv.classList.add('show');
                return;
            }

            // 生成结果
            let resultHTML = '';

            if (greenNeeded > 0) {
                resultHTML += `
                    <div class="info-box warning main-result">
                        ⚠️ 还需要 <strong>${greenNeeded}</strong> 个绿沙才能升到747！
                    </div>
                `;
            } else {
                resultHTML += `
                    <div class="info-box success main-result">
                        ✅ 材料充足！可以升到747！
                    </div>
                `;
            }

            // 显示升级路径建议
            resultHTML += `<div class="info-box">
                <strong>💡 升级建议：</strong><br>
                • 从 ${currentLevel} 到 737：先使用 ${actualBlueUsed} 个蓝沙，再使用 ${greenStepsNeeded} 个绿沙<br>
                • 从 737 到 747：使用 1 个蓝沙（必须）
            </div>`;

            // 详细分析面板
            resultHTML += `
                <button class="collapsible">📊 详细分析</button>
                <div class="collapsible-content">
                    <p style="margin-top: 10px;"><strong>数据详情：</strong></p>
                    <p>• 总共需要档位：${totalSteps} 个</p>
                    <p>• 使用蓝沙（含最后1个）：${actualBlueUsed + 1} 个</p>
                    <p>• 使用绿沙：${Math.min(greenSand, greenStepsNeeded)} 个</p>
                    <p style="margin-top: 10px;"><strong>注意事项：</strong></p>
                    <p>• 蓝沙最多使用16个</p>
                    <p>• 至少需要2个绿沙</p>
                    <p>• 最后一次升级（737→747）必须使用蓝沙</p>
                </div>
            `;

            resultDiv.innerHTML = resultHTML;
            resultDiv.classList.add('show');
        }

        // 装等输入框智能调整逻辑
        const currentLevelInput = document.getElementById('currentLevel');

        // 获取有效等级列表（584-737）
        const validLevels = levelSequence.filter(level => level >= 584 && level <= 737);

        // 记录上一个有效值,用于判断增减方向
        let previousValue = validLevels[0];

        // 处理spinner按钮点击（输入框右侧的上下箭头按钮）
        currentLevelInput.addEventListener('input', function (e) {
            const currentValue = parseInt(this.value);

            if (!isNaN(currentValue)) {
                // 判断是增加还是减少
                const isIncreasing = currentValue > previousValue;

                if (currentValue >= 584 && currentValue <= 737) {
                    // 如果输入的值不在有效列表中，自动调整到相应方向的最近有效值
                    if (!validLevels.includes(currentValue)) {
                        let targetLevel;

                        if (isIncreasing) {
                            // 向上找最近的有效值(大于等于当前值的第一个)
                            targetLevel = validLevels.find(level => level >= currentValue);
                            if (!targetLevel) targetLevel = validLevels[validLevels.length - 1];
                        } else {
                            // 向下找最近的有效值(小于等于当前值的最后一个)
                            for (let i = validLevels.length - 1; i >= 0; i--) {
                                if (validLevels[i] <= currentValue) {
                                    targetLevel = validLevels[i];
                                    break;
                                }
                            }
                            if (!targetLevel) targetLevel = validLevels[0];
                        }

                        this.value = targetLevel;
                        previousValue = targetLevel;
                    } else {
                        previousValue = currentValue;
                    }
                }
            }
        });

        // 处理键盘上下箭头
        currentLevelInput.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();

                const currentValue = parseInt(this.value) || 584;
                let currentIndex = validLevels.indexOf(currentValue);

                // 如果当前值不在有效列表中，找到最接近的有效值
                if (currentIndex === -1) {
                    currentIndex = validLevels.findIndex(level => level >= currentValue);
                    if (currentIndex === -1) currentIndex = validLevels.length - 1;
                }

                if (e.key === 'ArrowUp' && currentIndex < validLevels.length - 1) {
                    this.value = validLevels[currentIndex + 1];
                } else if (e.key === 'ArrowDown' && currentIndex > 0) {
                    this.value = validLevels[currentIndex - 1];
                }
            }
        });

        // 处理鼠标滚轮
        currentLevelInput.addEventListener('wheel', function (e) {
            if (document.activeElement === this) {
                e.preventDefault();

                const currentValue = parseInt(this.value) || 584;
                let currentIndex = validLevels.indexOf(currentValue);

                // 如果当前值不在有效列表中，找到最接近的有效值
                if (currentIndex === -1) {
                    currentIndex = validLevels.findIndex(level => level >= currentValue);
                    if (currentIndex === -1) currentIndex = validLevels.length - 1;
                }

                if (e.deltaY < 0 && currentIndex < validLevels.length - 1) {
                    this.value = validLevels[currentIndex + 1];
                } else if (e.deltaY > 0 && currentIndex > 0) {
                    this.value = validLevels[currentIndex - 1];
                }
            }
        });

        // 回车键触发计算
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });

        // 使用事件委托处理所有可展开面板（包括动态添加的）
        document.body.addEventListener('click', function (e) {
            if (e.target.classList.contains('collapsible')) {
                e.target.classList.toggle('active');
                const content = e.target.nextElementSibling;
                if (content && content.classList.contains('collapsible-content')) {
                    content.classList.toggle('active');
                }
            }
        });
    </script>
</body>
</html>
