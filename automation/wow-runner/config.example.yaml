# wow-runner 示例配置。复制为 config.yaml，并按本机安装路径、账号和键位修改。

display:
  # 仅作校准记录；runner 自身会启用 Per-Monitor DPI Awareness V2。
  resolution: "3840x2160"
  windows_scaling_percent: 200

process:
  battle_net_exe: "Battle.net.exe"
  battle_net_launch_exe: 'C:\Program Files (x86)\Battle.net\Battle.net Launcher.exe'
  wow_exe: "Wow.exe"

bnet:
  # OCR 主路径会识别并点击这些文字。坐标保持 (0,0) 即不使用坐标回退。
  game_select_click: { x: 0, y: 0 }
  enter_game_click: { x: 0, y: 0 }
  game_labels: ["魔兽世界", "World of Warcraft"]
  play_labels: ["进入游戏", "Play"]
  # 仅 ocr.enabled=false 时可配置已校准模板；OCR 主路径应留空。
  ready_template: ""

keys:
  # 若“与目标互动”已绑定为和附近 NPC 互动，两项都可留空。
  auctioneer_target: ""
  auction_tar_macro: ""
  # 支持键盘键/组合键，也支持 MOUSEWHEELDOWN、MOUSEWHEELUP。
  interact_target: "MOUSEWHEELDOWN"
  # 可选：动作条上的 /logout 宏键；留空时回退为聊天命令 /logout。
  logout_macro: "1"
  char_home: "Home"
  char_select_down: "Down"
  enter_world: "Enter"

timeouts_seconds:
  bnet_start: 180
  bnet_ui_ready: 60
  wow_foreground: 90
  char_select: 120
  enter_world: 180
  enter_world_load: 1
  ah_open: 30
  ah_prep: 2
  # ReplicateItems 有服务端限流，需覆盖约 15 分钟等待窗口。
  max_since_scan_trigger: 1200
  # /logout 或 /quit 后等待选角界面/进程自然退出；超时不会强杀。
  graceful_exit: 90

retry:
  max_retries_per_character: 1
  max_restart_total: 1

characters:
  # current：保持选角页当前角色；single：Home 后选 indices[0]；all：按 indices 依次扫描。
  mode: current
  # 0 表示 Home 后第一个角色，1 表示向下 1 次，以此类推。
  indices: [0]

# OCR 关闭时才使用这些模板作为回退。真实使用必须换成实机截图，不能用占位图判成功。
templates:
  ah_open_ok: ""
  plugin_scan_started: ""
  plugin_scan_complete: ""
  char_select_screen: ""
  enter_world_actionbar: ""

vision:
  poll_interval_ms: 500
  match_threshold: 0.88
  match_method: ncc
  color_gate_max_avg_channel_diff: 0
  search_roi: { x: 0, y: 0, w: 0, h: 0 }

ocr:
  enabled: true
  language: "zh-Hans-CN"
  poll_interval_ms: 750
  stable_reads: 2
  ready_tokens: ["AS_READY"]
  char_select_tokens: ["进入魔兽世界", "Enter World"]
  waiting_tokens: ["AS_WAITING"]
  scanning_tokens: ["AS_SCANNING"]
  complete_tokens: ["AS_COMPLETE"]
  warning_tokens: ["AS_WARNING"]
  error_tokens: ["AS_ERROR"]

snapshot:
  # source 非空时优先；否则从 retail_root + account 自动发现 SavedVariables。
  source: ''
  retail_root: 'F:\World of Warcraft'
  # 多账号机器必须明确填写 WTF/Account 下的目录名或唯一子串。
  account: 'YOUR_ACCOUNT_ID'
  destination: '../../data/auction.lua'
  archive_dir: '../../data/archive'
  import_enabled: true
  python_exe: '../../.venv/Scripts/python.exe'
  importer_script: '../../backend/import_auction.py'
  # 留空时后端默认写入仓库 data/wow-auction.db；生产环境可填 mysql+pymysql://...
  database_url: ''
  # 仅最后一个角色正常退出 Wow.exe、且归档/导入/复核全部成功后执行。
  clear_source_after_import: true

debug:
  failure_capture_dir: "captures"

logging:
  level: INFO
