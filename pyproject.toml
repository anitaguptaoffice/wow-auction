[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[project]
name = "wow-auction"
version = "0.1.0"
description = "WoW auction snapshot importer and CloudBase market API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "pymysql>=1.1.1",
    "slpp>=1.2.3",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
wow-auction-import = "import_auction:main"
